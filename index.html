<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Trilha do Sorriso Saudável</title>
    <!-- Importando fonte arredondada para visual infantil -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Fredoka', sans-serif; 
            margin: 0; 
            padding: 20px; 
            /* Fundo azul com padrão de bolinhas brancas */
            background-color: #87CEFA; 
            background-image: radial-gradient(#ffffff 15%, transparent 16%), radial-gradient(#ffffff 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: #333; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #fff;
            text-align: center;
            font-size: 2.5em;
            letter-spacing: 2px;
            margin-bottom: 30px;
            /* Contorno duplo para destacar o título no fundo */
            text-shadow: 
                -3px -3px 0 #ff9000,  
                 3px -3px 0 #ff9000,
                -3px  3px 0 #ff9000,
                 3px  3px 0 #ff9000,
                 5px  5px 0 #c26d00;
        }

        .nav-buttons { 
            display: flex; 
            gap: 20px; 
            margin-bottom: 30px; 
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Efeito de botão 3D de jogo */
        button { 
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            padding: 15px 30px; 
            font-size: 1.2em; 
            cursor: pointer; 
            border: none; 
            border-radius: 30px; 
            background-color: #ff9000; 
            color: white;
            box-shadow: 0 8px 0 #c26d00, 0 15px 20px rgba(0,0,0,0.2);
            transition: all 0.1s ease-in-out;
            text-transform: uppercase;
        }

        button:hover { 
            background-color: #ffa500; 
        }

        /* Animação ao clicar (o botão afunda) */
        button:active {
            box-shadow: 0 0px 0 #c26d00, 0 5px 10px rgba(0,0,0,0.2);
            transform: translateY(8px);
        }

        #app-container {
            width: 100%;
            max-width: 800px;
        }

        .mensagem-inicial {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-size: 1.2em;
            border: 4px dashed #ff9000;
        }

        /* Estilo das Cartas */
        .card { 
            background: white; 
            padding: 25px; 
            margin-bottom: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 0 rgba(0,0,0,0.1); 
            border: 4px solid #ccc; 
            position: relative;
            /* Aciona a animação de entrada */
            animation: pular 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        /* Animação "Bouncy" nas cartas */
        @keyframes pular {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card h3 { 
            margin-top: 0; 
            font-size: 1.5em;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        
        /* Cores baseadas nos setores da roleta */
        .borda-Verde { border-color: #92d050; border-bottom-width: 10px; }
        .borda-Verde h3 { color: #5e8a2f; }

        .borda-Azul { border-color: #00b0f0; border-bottom-width: 10px; }
        .borda-Azul h3 { color: #0076a3; }

        .borda-Amarelo { border-color: #ffc000; border-bottom-width: 10px; }
        .borda-Amarelo h3 { color: #b38600; }

        .borda-Vermelho { border-color: #ff0000; border-bottom-width: 10px; }
        .borda-Vermelho h3 { color: #a60000; }

        /* Estilização das listas dentro das cartas */
        ul.opcoes-lista {
            list-style-type: none; 
            padding: 0;
            margin: 20px 0;
        }

        ul.opcoes-lista li {
            background-color: #f0f8ff;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #b3d4fc;
            font-size: 1.1em;
        }

        .resposta-box {
            background-color: #fff9e6; 
            padding: 15px; 
            border-radius: 15px; 
            border: 3px dashed #ffc000;
            margin-top: 20px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <h1>🦷 A Trilha do Sorriso Saudável ✨</h1>
    
    <div class="nav-buttons">
        <button onclick="renderizarRegras()">📜 Como Jogar</button>
        <button onclick="renderizarPerguntas()">🎲 Pegar Carta</button>
    </div>

    <div id="app-container">
        <h2 class="mensagem-inicial">Selecione um dos botões acima para começar! 🚀</h2>
    </div>

    <!-- Importando os arquivos separadamente -->
    <script src="regras.js"></script>
    <script src="perguntas.js"></script>
    <script src="app.js"></script>

</body>
</html>
